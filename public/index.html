<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Game</title>
  <style>body { margin: 0; background: #111; }</style>
</head>
<body>
  <div id="chat" style="position:fixed;left:10px;bottom:10px;width:300px;max-width:70vw;font:14px sans-serif;color:#fff;">
    <div id="chat-log" style="max-height:140px;overflow-y:auto;background:rgba(0,0,0,.45);padding:6px;border-radius:6px 6px 0 0;"></div>
    <input id="chat-input" maxlength="120" placeholder="Click here to chat, Enter to send" autocomplete="off" style="width:100%;box-sizing:border-box;padding:8px;border:0;border-radius:0 0 6px 6px;background:#2a2d3e;color:#fff;font:14px sans-serif;">
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/phaser/phaser.min.js"></script>
  <script src="game.js"></script>
  <script src="chat.js"></script>
</body>
</html>
